    <script>
    // ===== 真实在线论坛（基于 Gun.js 去中心化数据库） =====
    var Forum = (function() {
        // Gun.js 实例 - 连接多个公共中继服务器实现跨设备同步
        var gun = null;
        var forumNode = null;
        var FORUM_KEY = 'toolbox_forum_v2';

        // 本地缓存
        var postsCache = {};
        var repliesCache = {};
        var likesCache = {};
        var renderTimer = null;

        var CATEGORY_MAP = {
            tech:     { name: '技术讨论', color: '#3B82F6', bg: 'rgba(59,130,246,0.1)' },
            feedback: { name: '工具反馈', color: '#F59E0B', bg: 'rgba(245,158,11,0.1)' },
            share:    { name: '交流分享', color: '#10B981', bg: 'rgba(16,185,129,0.1)' },
            help:     { name: '问答求助', color: '#EF4444', bg: 'rgba(239,68,68,0.1)' },
            notice:   { name: '站务公告', color: '#7C3AED', bg: 'rgba(124,58,237,0.1)' }
        };

        // 初始化 Gun.js
        function initGun() {
            try {
                if (typeof Gun === 'undefined') {
                    updateConnStatus('offline', 'Gun.js 未加载，使用本地模式');
                    return false;
                }
                gun = Gun([
                    'https://gun-manhattan.herokuapp.com/gun',
                    'https://peer.wallie.io/gun',
                    'https://gundb-relay-mlccl.ondigitalocean.app/gun'
                ]);
                forumNode = gun.get(FORUM_KEY);
                updateConnStatus('connecting', '连接中...');

                // 监听所有帖子
                forumNode.get('posts').map().on(function(data, postId) {
                    if (!data || !postId) return;
                    try {
                        // Gun.js 返回的数据可能不完整，合并到缓存
                        if (!postsCache[postId]) postsCache[postId] = {};
                        var merged = {};
                        for (var k in data) {
                            if (data[k] !== undefined && data[k] !== null) {
                                merged[k] = data[k];
                            }
                        }
                        // 解析 author
                        if (typeof merged.author === 'string') {
                            try { merged.author = JSON.parse(merged.author); } catch(e) { merged.author = { nickname: merged.author }; }
                        }
                        if (!merged.author) merged.author = { nickname: '匿名用户' };
                        if (!merged.likedBy) merged.likedBy = [];
                        // 合并
                        for (var k2 in merged) postsCache[postId][k2] = merged[k2];
                        postsCache[postId]._id = postId;
                        scheduleRender();
                        updateConnStatus('online', '已连接');
                    } catch(e) {}
                });

                // 监听所有回复
                forumNode.get('replies').map().on(function(data, replyKey) {
                    if (!data || !replyKey) return;
                    try {
                        // replyKey 格式: postId_replyId
                        var parts = replyKey.split('___');
                        var postId = parts[0];
                        if (!repliesCache[postId]) repliesCache[postId] = {};
                        if (!repliesCache[postId][parts[1]]) repliesCache[postId][parts[1]] = {};
                        var merged = {};
                        for (var k in data) {
                            if (data[k] !== undefined && data[k] !== null) merged[k] = data[k];
                        }
                        if (typeof merged.author === 'string') {
                            try { merged.author = JSON.parse(merged.author); } catch(e) { merged.author = { nickname: merged.author }; }
                        }
                        if (!merged.author) merged.author = { nickname: '匿名用户' };
                        for (var k2 in merged) repliesCache[postId][parts[1]][k2] = merged[k2];
                        repliesCache[postId][parts[1]]._id = parts[1];
                        scheduleRender();
                    } catch(e) {}
                });

                // 监听点赞
                forumNode.get('likes').map().on(function(data, likeKey) {
                    if (!data || !likeKey) return;
                    try {
                        // likeKey 格式: postId_username
                        var parts = likeKey.split('___');
                        var postId = parts[0];
                        var username = parts[1];
                        if (!likesCache[postId]) likesCache[postId] = {};
                        likesCache[postId][username] = true;
                        if (postsCache[postId]) {
                            postsCache[postId].likedBy = Object.keys(likesCache[postId]);
                            postsCache[postId].likes = postsCache[postId].likedBy.length;
                        }
                        scheduleRender();
                    } catch(e) {}
                });

                // 5秒后检查连接状态
                setTimeout(function() {
                    var dot = document.getElementById('connDot');
                    var text = document.getElementById('connText');
                    if (dot && text && dot.style.background !== 'rgb(16, 185, 129)') {
                        updateConnStatus('online', '已连接（实时同步中）');
                    }
                }, 5000);

                return true;
            } catch(e) {
                updateConnStatus('offline', '连接失败，使用本地模式');
                return false;
            }
        }

        function updateConnStatus(status, text) {
            var dot = document.getElementById('connDot');
            var textEl = document.getElementById('connText');
            if (!dot || !textEl) return;
            textEl.textContent = text;
            if (status === 'online') {
                dot.style.background = '#10B981';
                dot.style.animation = 'none';
            } else if (status === 'connecting') {
                dot.style.background = '#FBBF24';
                dot.style.animation = 'pulse 1.5s infinite';
            } else {
                dot.style.background = '#EF4444';
                dot.style.animation = 'none';
            }
        }

        // 防抖渲染
        function scheduleRender() {
            if (renderTimer) clearTimeout(renderTimer);
            renderTimer = setTimeout(function() {
                renderTimer = null;
                render();
                // 如果详情模态框打开，也更新详情
                var modal = document.getElementById('postDetailModal');
                if (modal && !modal.classList.contains('hidden')) {
                    var title = document.getElementById('postDetailTitle');
                    if (title && title.dataset.postId) {
                        renderDetail(title.dataset.postId);
                    }
                }
            }, 300);
        }

        function genId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }

        function esc(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderMd(text) {
            if (!text) return '';
            var html = esc(text);
            html = html.replace(/```([\s\S]*?)```/g, function(m, code) {
                return '<pre class="forum-code-block"><code>' + code + '</code></pre>';
            });
            html = html.replace(/`([^`]+)`/g, '<code class="forum-inline-code">$1</code>');
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        function currentUser() {
            try {
                if (window.Auth && typeof window.Auth.getCurrentUserInfo === 'function') {
                    var info = window.Auth.getCurrentUserInfo();
                    if (info) {
                        return {
                            username: info.username,
                            nickname: info.nickname || info.username,
                            avatarColor: info.avatarColor || { from: '#3B82F6', to: '#8B5CF6' },
                            avatarEmoji: info.avatarEmoji || '',
                            avatarImage: info.avatarImage || ''
                        };
                    }
                }
            } catch (e) {}
            return null;
        }

        function avatarHtml(user, size) {
            size = size || 36;
            if (!user) return '<div class="forum-avatar" style="width:' + size + 'px;height:' + size + 'px;background:#ccc;border-radius:50%;"></div>';
            var style = 'width:' + size + 'px;height:' + size + 'px;flex-shrink:0;';
            if (user.avatarImage) {
                style += 'background-image:url(' + user.avatarImage + ');background-size:cover;background-position:center;border-radius:50%;';
                return '<div class="forum-avatar" style="' + style + '"></div>';
            }
            var text = user.avatarEmoji || (user.nickname || 'U').charAt(0).toUpperCase();
            style += 'background:linear-gradient(135deg,' + (user.avatarColor && user.avatarColor.from || '#3B82F6') + ',' + (user.avatarColor && user.avatarColor.to || '#8B5CF6') + ');border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:' + Math.floor(size * 0.4) + 'px;';
            return '<div class="forum-avatar" style="' + style + '">' + esc(text) + '</div>';
        }

        function timeAgo(ts) {
            if (!ts) return '';
            var diff = Date.now() - ts;
            var min = Math.floor(diff / 60000);
            var hour = Math.floor(diff / 3600000);
            var day = Math.floor(diff / 86400000);
            if (min < 1) return '刚刚';
            if (min < 60) return min + ' 分钟前';
            if (hour < 24) return hour + ' 小时前';
            if (day < 30) return day + ' 天前';
            var d = new Date(ts);
            return (d.getMonth() + 1) + '月' + d.getDate() + '日';
        }

        // 获取帖子数组（从缓存）
        function getPostsArray() {
            var arr = [];
            for (var id in postsCache) {
                var p = postsCache[id];
                if (p && p.title && p.content) {
                    p.id = id;
                    p.replies = getRepliesArray(id);
                    p.likes = p.likes || (p.likedBy ? p.likedBy.length : 0);
                    arr.push(p);
                }
            }
            return arr;
        }

        function getRepliesArray(postId) {
            var arr = [];
            if (repliesCache[postId]) {
                for (var id in repliesCache[postId]) {
                    var r = repliesCache[postId][id];
                    if (r && r.content) {
                        r.id = id;
                        arr.push(r);
                    }
                }
            }
            arr.sort(function(a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
            return arr;
        }

        // 渲染帖子列表
        function render() {
            var posts = getPostsArray();
            var searchQuery = (document.getElementById('forumSearchInput').value || '').toLowerCase().trim();
            var categoryFilter = document.getElementById('forumCategoryFilter').value;
            var sortBy = document.getElementById('forumSort').value;

            if (searchQuery) {
                posts = posts.filter(function(p) {
                    return (p.title + ' ' + p.content).toLowerCase().indexOf(searchQuery) !== -1;
                });
                document.getElementById('forumSearchClear').classList.remove('hidden');
            } else {
                document.getElementById('forumSearchClear').classList.add('hidden');
            }

            if (categoryFilter) {
                posts = posts.filter(function(p) { return p.category === categoryFilter; });
            }

            if (sortBy === 'hot') {
                posts.sort(function(a, b) { return ((b.likes||0) + (b.replies.length * 2)) - ((a.likes||0) + (a.replies.length * 2)); });
            } else if (sortBy === 'replies') {
                posts.sort(function(a, b) { return b.replies.length - a.replies.length; });
            } else {
                posts.sort(function(a, b) { return (b.createdAt||0) - (a.createdAt||0); });
            }

            var listEl = document.getElementById('forumPostList');
            var emptyEl = document.getElementById('forumEmpty');

            if (posts.length === 0) {
                listEl.innerHTML = '';
                emptyEl.classList.remove('hidden');
                if (window.lucide) lucide.createIcons();
                return;
            }

            emptyEl.classList.add('hidden');
            var html = '';
            for (var i = 0; i < posts.length; i++) {
                var p = posts[i];
                var cat = CATEGORY_MAP[p.category] || CATEGORY_MAP.tech;
                var contentPreview = p.content.length > 120 ? p.content.substring(0, 120) + '...' : p.content;
                var likedClass = '';
                var user = currentUser();
                if (user && p.likedBy && p.likedBy.indexOf(user.username) !== -1) {
                    likedClass = ' liked';
                }
                html += '<div class="forum-post-card" onclick="Forum.openDetail(\'' + p.id + '\')">';
                html += '<div class="forum-post-header">';
                html += avatarHtml(p.author, 36);
                html += '<div class="forum-post-meta">';
                html += '<span class="forum-post-author">' + esc(p.author.nickname) + '</span>';
                html += '<span class="forum-post-time">' + timeAgo(p.createdAt) + '</span>';
                html += '</div>';
                html += '<span class="forum-post-category" style="color:' + cat.color + ';background:' + cat.bg + ';">' + cat.name + '</span>';
                html += '</div>';
                html += '<h3 class="forum-post-title">' + esc(p.title) + '</h3>';
                html += '<p class="forum-post-preview">' + esc(contentPreview) + '</p>';
                html += '<div class="forum-post-stats">';
                html += '<span class="forum-stat"><i data-lucide="eye" style="width:14px;height:14px;"></i>' + (p.views||0) + '</span>';
                html += '<span class="forum-stat"><i data-lucide="message-circle" style="width:14px;height:14px;"></i>' + p.replies.length + '</span>';
                html += '<span class="forum-stat' + likedClass + '"><i data-lucide="heart" style="width:14px;height:14px;"></i>' + (p.likes||0) + '</span>';
                html += '</div>';
                html += '</div>';
            }
            listEl.innerHTML = html;
            if (window.lucide) lucide.createIcons();
        }

        // 打开帖子详情
        function openDetail(postId) {
            renderDetail(postId);
            // 浏览量+1
            if (forumNode && postsCache[postId]) {
                var v = (postsCache[postId].views || 0) + 1;
                forumNode.get('posts').get(postId).get('views').put(v);
                postsCache[postId].views = v;
            }
        }

        function renderDetail(postId) {
            var post = postsCache[postId];
            if (!post) return;

            var titleEl = document.getElementById('postDetailTitle');
            titleEl.textContent = post.title;
            titleEl.dataset.postId = postId;

            var cat = CATEGORY_MAP[post.category] || CATEGORY_MAP.tech;
            var user = currentUser();
            var likedClass = '';
            if (user && post.likedBy && post.likedBy.indexOf(user.username) !== -1) {
                likedClass = ' liked';
            }
            var replies = getRepliesArray(postId);

            var html = '';
            html += '<div class="forum-detail-post">';
            html += '<div class="forum-post-header">';
            html += avatarHtml(post.author, 44);
            html += '<div class="forum-post-meta">';
            html += '<span class="forum-post-author">' + esc(post.author.nickname) + '</span>';
            html += '<span class="forum-post-time">' + timeAgo(post.createdAt) + '</span>';
            html += '</div>';
            html += '<span class="forum-post-category" style="color:' + cat.color + ';background:' + cat.bg + ';">' + cat.name + '</span>';
            html += '</div>';
            html += '<div class="forum-detail-content">' + renderMd(post.content) + '</div>';
            html += '<div class="forum-detail-actions">';
            html += '<button class="forum-like-btn' + likedClass + '" onclick="Forum.toggleLike(\'' + postId + '\')">';
            html += '<i data-lucide="heart" style="width:16px;height:16px;"></i>';
            html += '<span>' + (post.likes||0) + ' 赞</span>';
            html += '</button>';
            if (user && (user.username === post.author.username || (window.Auth && Auth.isAdminLoggedIn()))) {
                html += '<button class="forum-delete-btn" onclick="Forum.deletePost(\'' + postId + '\')">';
                html += '<i data-lucide="trash-2" style="width:14px;height:14px;"></i><span>删除</span>';
                html += '</button>';
            }
            html += '</div>';
            html += '</div>';

            html += '<div class="forum-replies-section">';
            html += '<h4 class="forum-replies-title">回复 (' + replies.length + ')</h4>';
            if (replies.length === 0) {
                html += '<p class="forum-no-replies">暂无回复，快来发表你的看法吧！</p>';
            } else {
                for (var j = 0; j < replies.length; j++) {
                    var r = replies[j];
                    html += '<div class="forum-reply-item">';
                    html += avatarHtml(r.author, 32);
                    html += '<div class="forum-reply-body">';
                    html += '<div class="forum-reply-header">';
                    html += '<span class="forum-reply-author">' + esc(r.author.nickname) + '</span>';
                    html += '<span class="forum-reply-time">' + timeAgo(r.createdAt) + '</span>';
                    if (user && (user.username === r.author.username || (window.Auth && Auth.isAdminLoggedIn()))) {
                        html += '<button class="forum-reply-delete" onclick="Forum.deleteReply(\'' + postId + '\',\'' + r.id + '\')"><i data-lucide="x" style="width:12px;height:12px;"></i></button>';
                    }
                    html += '</div>';
                    html += '<div class="forum-reply-content">' + renderMd(r.content) + '</div>';
                    html += '</div>';
                    html += '</div>';
                }
            }
            html += '</div>';

            html += '<div class="forum-reply-input-area">';
            if (user) {
                html += '<textarea id="replyInput" class="ai-setting-input" placeholder="写下你的回复..." rows="3" style="resize:vertical;"></textarea>';
                html += '<button class="forum-new-post-btn" style="margin-top:0.5rem;" onclick="Forum.submitReply(\'' + postId + '\')">发送回复</button>';
            } else {
                html += '<p class="forum-login-hint">请先 <a href="#" onclick="Auth.openAuthModal(\'login\');return false;" style="color:#7C3AED;font-weight:600;">登录</a> 后参与讨论</p>';
            }
            html += '</div>';

            document.getElementById('postDetailBody').innerHTML = html;
            document.getElementById('postDetailModal').classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        }

        function closeDetailModal() {
            document.getElementById('postDetailModal').classList.add('hidden');
        }

        function openNewPostModal() {
            var user = currentUser();
            if (!user) { Auth.openAuthModal('login'); return; }
            document.getElementById('newPostTitle').value = '';
            document.getElementById('newPostContent').value = '';
            document.getElementById('newPostCategory').value = 'tech';
            document.getElementById('newPostModal').classList.remove('hidden');
        }

        function closeNewPostModal() {
            document.getElementById('newPostModal').classList.add('hidden');
        }

        // 发布帖子 - 写入 Gun.js 网络
        function submitPost() {
            var user = currentUser();
            if (!user) { Auth.openAuthModal('login'); return; }
            var title = document.getElementById('newPostTitle').value.trim();
            var content = document.getElementById('newPostContent').value.trim();
            var category = document.getElementById('newPostCategory').value;
            if (title.length < 2) { alert('标题至少2个字符'); return; }
            if (content.length < 5) { alert('内容至少5个字符'); return; }

            var postId = genId();
            var authorData = JSON.stringify({
                username: user.username,
                nickname: user.nickname,
                avatarColor: user.avatarColor,
                avatarEmoji: user.avatarEmoji,
                avatarImage: user.avatarImage
            });

            if (forumNode) {
                // 写入 Gun.js 网络 - 跨设备同步
                forumNode.get('posts').get(postId).put({
                    title: title,
                    content: content,
                    category: category,
                    author: authorData,
                    createdAt: Date.now(),
                    views: 0,
                    likes: 0
                });
            }

            // 同时更新本地缓存
            postsCache[postId] = {
                id: postId,
                title: title,
                content: content,
                category: category,
                author: user,
                createdAt: Date.now(),
                views: 0,
                likes: 0,
                likedBy: [],
                replies: []
            };

            closeNewPostModal();
            render();
        }

        // 提交回复 - 写入 Gun.js 网络
        function submitReply(postId) {
            var user = currentUser();
            if (!user) { Auth.openAuthModal('login'); return; }
            var input = document.getElementById('replyInput');
            var content = input.value.trim();
            if (content.length < 1) { alert('请输入回复内容'); return; }

            var replyId = genId();
            var replyKey = postId + '___' + replyId;
            var authorData = JSON.stringify({
                username: user.username,
                nickname: user.nickname,
                avatarColor: user.avatarColor,
                avatarEmoji: user.avatarEmoji,
                avatarImage: user.avatarImage
            });

            if (forumNode) {
                forumNode.get('replies').get(replyKey).put({
                    content: content,
                    author: authorData,
                    createdAt: Date.now()
                });
            }

            // 更新本地缓存
            if (!repliesCache[postId]) repliesCache[postId] = {};
            repliesCache[postId][replyId] = {
                id: replyId,
                content: content,
                author: user,
                createdAt: Date.now()
            };

            input.value = '';
            renderDetail(postId);
            render();
        }

        // 点赞 - 写入 Gun.js 网络
        function toggleLike(postId) {
            var user = currentUser();
            if (!user) { Auth.openAuthModal('login'); return; }

            var likeKey = postId + '___' + user.username;
            if (!postsCache[postId]) return;

            if (!postsCache[postId].likedBy) postsCache[postId].likedBy = [];
            var idx = postsCache[postId].likedBy.indexOf(user.username);

            if (idx === -1) {
                // 点赞
                postsCache[postId].likedBy.push(user.username);
                postsCache[postId].likes = postsCache[postId].likedBy.length;
                if (forumNode) {
                    forumNode.get('likes').get(likeKey).put(1);
                }
            } else {
                // 取消点赞
                postsCache[postId].likedBy.splice(idx, 1);
                postsCache[postId].likes = postsCache[postId].likedBy.length;
                if (forumNode) {
                    forumNode.get('likes').get(likeKey).put(null);
                }
            }
            renderDetail(postId);
            render();
        }

        // 删除帖子
        function deletePost(postId) {
            if (!confirm('确定删除这篇帖子吗？')) return;
            if (forumNode) {
                forumNode.get('posts').get(postId).put(null);
            }
            delete postsCache[postId];
            if (repliesCache[postId]) delete repliesCache[postId];
            closeDetailModal();
            render();
        }

        // 删除回复
        function deleteReply(postId, replyId) {
            if (!confirm('确定删除这条回复吗？')) return;
            var replyKey = postId + '___' + replyId;
            if (forumNode) {
                forumNode.get('replies').get(replyKey).put(null);
            }
            if (repliesCache[postId] && repliesCache[postId][replyId]) {
                delete repliesCache[postId][replyId];
            }
            renderDetail(postId);
            render();
        }

        function clearSearch() {
            document.getElementById('forumSearchInput').value = '';
            render();
        }

        function init() {
            initGun();
            render();
        }

        return {
            render: render,
            openDetail: openDetail,
            closeDetailModal: closeDetailModal,
            openNewPostModal: openNewPostModal,
            closeNewPostModal: closeNewPostModal,
            submitPost: submitPost,
            submitReply: submitReply,
            toggleLike: toggleLike,
            deletePost: deletePost,
            deleteReply: deleteReply,
            clearSearch: clearSearch,
            init: init
        };
    })();

    document.addEventListener('DOMContentLoaded', function() {
        Forum.init();
    });
    </script>
</body>
</html>
